name: Phase 27C Forebet Alias Registry Consistency
on:
  pull_request:
    paths:
      - "scripts/sql/phase27c-forebet-registry-sync.sql"
      - "scripts/check-phase27c-registry-sync.mjs"
      - ".github/workflows/phase27c-forebet-registry-sync.yml"
  push:
    paths:
      - "scripts/sql/phase27c-forebet-registry-sync.sql"
      - "scripts/check-phase27c-registry-sync.mjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check-phase27c-registry-sync.mjs
