name: Raw Flashscore dashboard verification
on:
  pull_request:
    branches: [main, release/ft-advisors-fotmob-20261011]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
        env:
          CF_PAGES: "1"
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory out > /tmp/raw-preview.log 2>&1 &
      - run: npx playwright test tests/public-flow.spec.js --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-dashboard-screenshots
          path: test-results/
