name: PR Build Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/pr-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify exact recovery baseline and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object components/homepage-client.js)" = "eda1644bcde74362cc6cb772a97cdefe153529fa"
          test "$(git hash-object components/match-detail-client.js)" = "8651a5b344b7c7f4fae05cbd1841bea5328b60a9"
          test "$(git hash-object components/lineup-panel.js)" = "277a32318da4cd9b128456f9aa6e2b872a742c45"
          test "$(git hash-object supabase/functions/app-match-story/index.ts)" = "84d0a61e3d818025be2c7f7635fa2d03731ca0d3"
          test ! -e scripts/check-recovery-source-contract.mjs
          test ! -e tests/recovery-flow.spec.js
          test "$(git hash-object docs/product-goal.md)" = "72317964f1e3c7d2c30611da1377ef52242f45e9"
          test "$(git hash-object docs/REDESIGN_CHECKLIST.md)" = "da56a1658db4860f6efcdd6d598419c50442f8b8"
          test "$(git hash-object docs/dashboard-redesign-handover-2026-10-03.md)" = "e0d7ec0ef214979ccf9026b93ad66170f3d84413"
          git apply --check scripts/recovery/fast-tracker-b3d20007-recovery-reviewed.patch
          git apply scripts/recovery/fast-tracker-b3d20007-recovery-reviewed.patch
          test "$(git hash-object components/homepage-client.js)" = "74f9487aef1d3ea82f8857866c0a4ed55d622d76"
          test "$(git hash-object components/match-detail-client.js)" = "66e1222e7653e8b01f881544c32bffbc13eb1abe"
          test "$(git hash-object components/lineup-panel.js)" = "52d46439bfdf085f4cd8e0ba5ce05da5ebc6c52b"
          test "$(git hash-object supabase/functions/app-match-story/index.ts)" = "bb018da84110b4782632fdf9deb9fa1ab34b0875"
          test "$(git hash-object scripts/check-recovery-source-contract.mjs)" = "83f51b47d38399a35a03fb709c07b43a9bc307b5"
          test "$(git hash-object tests/recovery-flow.spec.js)" = "cd51f6630a74bf01027b668da89ddf171a7c60b2"
          test "$(git hash-object docs/product-goal.md)" = "d79ca0a8804381366fb0ca37301b26961ae7a6fe"
          test "$(git hash-object docs/REDESIGN_CHECKLIST.md)" = "b37726d73299f0d0726c90aa3d435155e5c6573d"
          test "$(git hash-object docs/dashboard-redesign-handover-2026-10-03.md)" = "c220f33bea1960f63a28c4348880deb730fefeba"

      - name: Check recovery source contract
        run: node scripts/check-recovery-source-contract.mjs


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Check visible escape artifacts
        run: npm run check:ui

      - name: Check English story contract
        run: npm run check:story

      - name: Check provider and bookmaker contract
        run: npm run check:market-contract

      - name: Check real-evidence safety gates
        run: npm run check:real-evidence

      - name: Check evidence independence
        run: npm run check:evidence-independence

      - name: Check player evidence identity
        run: npm run check:player-evidence

      - name: Build static app
        id: static_build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          CF_PAGES: "1"

      - name: Report build failure on PR
        if: steps.static_build.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'build.log missing';
            const tail = raw.slice(-7000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### PR build diagnostic',
                '',
                'Static build failed on commit `' + context.sha.slice(0, 8) + '`.',
                '',
                '```text',
                tail,
                '```'
              ].join('\n')
            });

      - name: Fail build job when static build failed
        if: steps.static_build.outputs.exit_code != '0'
        run: exit 1

      - name: Verify static routes
        if: steps.static_build.outputs.exit_code == '0'
        run: |
          test -f out/index.html
          test -f out/details/index.html
          test -f out/health/index.html
          test -f out/match/index.html
          test -f out/system/index.html

      - name: Install Chromium for rendered flow tests
        if: steps.static_build.outputs.exit_code == '0'
        run: npx playwright install --with-deps chromium

      - name: Render static preview locally
        if: steps.static_build.outputs.exit_code == '0'
        run: |
          python3 -m http.server 4173 --directory out > /tmp/fast-tracker-preview.log 2>&1 &
          echo $! > /tmp/fast-tracker-preview.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fast-tracker-preview.log
          exit 1

      - name: Rendered desktop/mobile flow
        id: rendered_flow
        if: steps.static_build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npx playwright test tests/public-flow.spec.js tests/recovery-flow.spec.js --reporter=line 2>&1 | tee playwright.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload dashboard redesign screenshots
        if: always() && steps.static_build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-redesign-${{ github.sha }}
          path: test-results/dashboard-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Report rendered-flow failure on PR
        if: steps.static_build.outputs.exit_code == '0' && steps.rendered_flow.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('playwright.log') ? fs.readFileSync('playwright.log', 'utf8') : 'playwright.log missing';
            const tail = raw.slice(-7000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### Rendered-flow diagnostic',
                '',
                'Desktop/mobile flow failed on commit `' + context.sha.slice(0, 8) + '`.',
                '',
                '```text',
                tail,
                '```'
              ].join('\n')
            });

      - name: Fail rendered-flow job when browser assertions failed
        if: steps.static_build.outputs.exit_code == '0' && steps.rendered_flow.outputs.exit_code != '0'
        run: exit 1
