name: Phase 21 Opt-in Experimental Model Preview
on:
  pull_request:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'lib/fast-tracker-dixon-coles-experimental.mjs'
      - 'supabase/functions/app-phase1-feed/index.ts'
      - 'supabase/functions/app-phase1-feed/dc-experimental.mjs'
      - 'components/flashscore-raw-match.js'
      - 'scripts/check-phase21-experimental-preview.mjs'
      - '.github/workflows/phase21-experimental-preview.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/check-phase20-experimental-dc-pi.mjs
      - run: node scripts/check-phase21-experimental-preview.mjs
      - run: node scripts/check-phase13-adviser-review.mjs
      - run: npm run build
