name: Phase 17 Observed Odds Movement
on:
  pull_request:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'supabase/functions/app-phase1-feed/index.ts'
      - 'lib/verified-evidence-feed.js'
      - 'components/homepage-client.js'
      - 'scripts/check-phase17-odds-movement-ui.mjs'
      - '.github/workflows/phase17-odds-movement.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/check-phase17-odds-movement-ui.mjs
      - run: node scripts/check-phase4-odds-timestamp.mjs
      - run: npm run build
