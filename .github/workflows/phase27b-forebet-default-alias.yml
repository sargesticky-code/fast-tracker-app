name: Phase 27B Forebet Default Display and Alias Seed
on:
  pull_request:
    paths:
      - "components/flashscore-raw-match.js"
      - "scripts/sql/phase27b-forebet-strict-alias-seed.sql"
      - "scripts/check-phase27b-alias-seed.mjs"
      - "scripts/check-forebet-pair-review.mjs"
      - ".github/workflows/phase27b-forebet-default-alias.yml"
  push:
    paths:
      - "components/flashscore-raw-match.js"
      - "scripts/sql/phase27b-forebet-strict-alias-seed.sql"
      - "scripts/check-phase27b-alias-seed.mjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/check-phase27b-alias-seed.mjs
      - run: node scripts/check-forebet-pair-review.mjs
      - run: npm run build
