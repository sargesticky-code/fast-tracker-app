name: Forebet Lean Pilot QA
on:
  pull_request:
    branches: [phase0/international-authority]
    paths:
      - scripts/forebet-lean-capture.py
      - scripts/forebet_lean_parser.py
      - scripts/requirements-forebet-lean.txt
      - tests/test_forebet_lean_parser.py
      - tests/test_forebet_lean_capture.py
      - .github/workflows/forebet-lean-pilot.yml
  workflow_dispatch:
  push:
    branches: [fix/forebet-lean-collector-20261011]
    paths:
      - scripts/forebet-lean-capture.py
      - scripts/forebet_lean_parser.py
      - scripts/requirements-forebet-lean.txt
      - tests/test_forebet_lean_parser.py
      - tests/test_forebet_lean_capture.py
      - .github/workflows/forebet-lean-pilot.yml
permissions:
  contents: read
jobs:
  normalize-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned HTML parsing dependency (offline fixture tests only)
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Test source HTML parsing and safe normalization (no provider network)
        run: |
          python -m py_compile scripts/forebet-lean-capture.py scripts/forebet_lean_parser.py
          python -m unittest discover -s tests -p 'test_forebet_lean_*.py' -v
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("fb", "scripts/forebet-lean-capture.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          row = dict(league="Premier League",home="Team A",away="Team B",
                     date_time="11/10/2026 18:00",prob_home="42%",prob_draw="38",
                     prob_away="20",predicted_score="2 - 1",avg_goals="2.95")
          assert mod.SOURCE_PAGES["today"] == "https://www.forebet.com/en/football-tips-and-predictions-for-today"
          assert mod.SOURCE_PAGES["tomorrow"] == "https://www.forebet.com/en/football-tips-and-predictions-for-tomorrow"
          out = mod.normalize_row(row)
          # Source reports US-style month/day and AM/PM in 2026.
          us = mod.normalize_row({**row,"date_time":"10/11/2026 6:00 PM"})
          assert us["source_kickoff_local_text"] == "10/11/2026 6:00 PM"
          assert us["source_kickoff_timezone"] is None
          assert "%m/%d/%Y %I:%M %p" in us["source_date_formats_possible"]
          assert out["canonical_match_id"] is None
          assert out["identity_status"] == "UNVERIFIED"
          assert out["predicted_score"] == "2 - 1"
          assert out["avg_goals"] == 2.95
          for bad in ({**row,"prob_home":"99"}, {**row,"date_time":"not a date"},
                      {**row,"avg_goals":"0"}, {**row,"predicted_score":"pending"},
                      {**row,"date_time":"99/99/2026 18:00"},
                      {**row,"date_time":"02/30/2026 6:00 PM"},
                      {**row,"away":"team a"}):
              try: mod.normalize_row(bad)
              except ValueError: pass
              else: raise AssertionError("invalid source promoted")
          print("SAFE_FOREBET_NORMALIZATION_PASS")
          PY
