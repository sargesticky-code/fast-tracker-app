name: Fast Tracker Raw + Verified Release QA
on:
  push:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release-advisor-ui-qa.yml'
permissions:
  contents: read
concurrency:
  group: fast-tracker-release-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate raw fixture and verified UI contract
        run: npm run build
        env:
          CF_PAGES: '1'
      - name: Verify exported public routes
        run: |
          test -f out/index.html
          test -f out/details/index.html
          test -f out/health/index.html
