name: Fast Tracker Raw + Verified Release QA
on:
  push:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release-advisor-ui-qa.yml'
permissions:
  contents: read
concurrency:
  group: fast-tracker-release-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # The production target is Vercel's Next.js runtime. Never force
      # CF_PAGES static export: /api/health is intentionally live/dynamic.
      - name: Validate raw fixture and verified UI contract
        run: npm run build
      - name: Verify server routes without downgrading live health
        run: |
          test -s .next/BUILD_ID
          test -s .next/server/app-paths-manifest.json
          node - <<'NODE'
          const routes = require('./.next/server/app-paths-manifest.json');
          for (const route of ['/page','/details/page','/health/page','/api/health/route']) {
            if (!routes[route]) throw new Error('Missing runtime route: ' + route);
          }
          console.log('PASS: four runtime routes built, live health preserved');
          NODE
