name: Release Advisor and FotMob UI QA
on:
  push:
    branches: [release/ft-advisors-fotmob-20261011]
    paths:
      - 'components/**'
      - 'lib/fast-tracker.js'
      - 'scripts/check-advisor-source-hierarchy.mjs'
      - '.github/workflows/release-advisor-ui-qa.yml'
permissions:
  contents: read
jobs:
  release-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund
      - name: Source priority, UI identity and no stale predictions
        run: |
          node scripts/check-advisor-source-hierarchy.mjs
          npm run check:ui
      - name: Build exact proposed public Railway release
        run: npm run build
        env:
          CF_PAGES: '1'
      - name: Validate Homepage and Detail static routes
        run: |
          test -f out/index.html
          test -f out/details/index.html
