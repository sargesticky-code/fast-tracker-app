name: FT500 limited frontend source-label QA
on:
  push:
    branches: [release/ft500-spf-label-20261010]
    paths: [lib/fast-tracker.js, components/homepage-client.js, supabase/functions/app-phase1-feed/index.ts, scripts/check-real-evidence-safety.mjs, scripts/check-ft500-reference-value.mjs, .github/workflows/ft500-label-qa.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run check:ui
      - run: npm run check:real-evidence
      - name: Regression — never derive 500 SPF EV
        run: node scripts/check-ft500-reference-value.mjs
      - name: Assert dated 500 SPF provenance survives observed stats and UI
        run: |
          grep -F -q '...(base.sourceContext??{})' supabase/functions/app-phase1-feed/index.ts
          grep -F -q 'China Sports Lottery SPF · reference only' components/homepage-client.js
          grep -F -q 'HDA prices unavailable' components/homepage-client.js
          grep -F -q 'canonicalHealthy(initialFeed)' components/homepage-client.js
          grep -F -q 'hedgeTimer = setTimeout(resolve, 1800)' lib/fast-tracker.js
          grep -F -q 'china ? datedReference : withinFreshness' lib/fast-tracker.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto supabase/functions/app-phase1-feed/index.ts
      - name: Verify public production summary contains dated 500 SPF reference, not value
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 30 \
            'https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/app-phase1-feed?view=summary&hours=48' -o /tmp/ft500-public-summary.json
          python - <<'PY'
          import datetime, json
          d=json.load(open('/tmp/ft500-public-summary.json'))
          assert d.get('source')=='flashscore-single-rpc-canonical', 'wrong API provenance'
          rows=d.get('matches')
          assert isinstance(rows,list) and len(rows)>=50, 'lost canonical fixtures'
          c=[x for x in rows if (x.get('sourceContext') or {}).get('marketAuthority')=='CHINA_500_SPF']
          # Zero upcoming eligible quotes is a valid no-op between matchdays.
          # When present, every published quote must retain non-actionable provenance.
          for x in c:
              o=x.get('odds') or {}
              assert all(isinstance(o.get(k),(float,int)) and o[k]>1 for k in ('home','draw','away'))
              assert x.get('decision') is None and x.get('decisionEdge') is None and x.get('market') is None
              ctx=x['sourceContext']
              assert ctx.get('quoteSemantics')=='PREMATCH_REFERENCE_ONLY'
              assert ctx.get('sourceUpdatedAt') and ctx.get('capturedAt')
              assert datetime.datetime.fromisoformat(x['kickoff'].replace('Z','+00:00'))>datetime.datetime.now(datetime.timezone.utc)
          print('FT500_PUBLIC_API_OK matches',len(rows),'dated_references',len(c),'ids',[x['id'] for x in c][:12])
          PY
      - run: npm run build
        env:
          CF_PAGES: '1'
