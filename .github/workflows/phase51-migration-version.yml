name: Phase 51 Migration Replay Safety
on:
  pull_request:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'supabase/migrations/*phase51*.sql'
      - 'scripts/check-phase51-migration-version.mjs'
      - '.github/workflows/phase51-migration-version.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-phase51-migration-version.mjs
