name: alias-sporty-model-pages-once
on:
  push:
    branches: [audit/alias-source-manual-chatgpt-20261011]
    paths: [.github/workflows/alias-sporty-model-pages-once.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 beautifulsoup4==4.14.3
      - run: python audit/sporty_model_pages_one_time.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sporty-model-all-pages-source-evidence
          path: sporty-model-pages/
          retention-days: 7
      - name: Record run ID to audit-only branch
        if: always()
        run: |
          printf '{"run_id": %s, "run_url": "https://github.com/%s/actions/runs/%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > audit/sporty-model-run-index.json
          git config user.name "FastTracker Audit Robot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audit/sporty-model-run-index.json
          git diff --cached --quiet || (git commit -m "audit: publish SportyTrader model pagination run id" && git push)
