name: One-Shot Alternative Advisor Availability
on:
  push:
    branches: [feat/alternate-advisor-source-probe-20261011]
    paths:
      - scripts/advisor_source_probe.py
      - .github/workflows/advisor-source-one-shot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-shot-read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile parser and probe exactly two provider pages, max one BetClan detail
        run: |
          python -m py_compile scripts/advisor_source_probe.py
          python scripts/advisor_source_probe.py
      - name: Preserve tiny evidence manifest only (no website dump, no DB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisor-readonly-public-feasibility
          path: advisor-probe-results.json
          retention-days: 7
