name: Phase 10 Adviser Discovery Filters
on:
  pull_request:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'lib/adviser-visibility.js'
      - 'components/homepage-client.js'
      - 'scripts/check-phase10-adviser-filters.mjs'
      - '.github/workflows/phase10-adviser-discovery.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-phase10-adviser-filters.mjs
      - run: node scripts/check-all-adviser-source-team-visibility.mjs
      - run: npm run build
