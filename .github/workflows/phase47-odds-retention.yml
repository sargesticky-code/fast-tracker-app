name: Phase 47 Odds Archive-First Retention
on:
  pull_request:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'supabase/migrations/20261018123000_phase47_odds_history_archive_first.sql'
      - 'supabase/functions/odds-cold-retire/index.ts'
      - 'scripts/check-phase47-odds-retention.mjs'
      - '.github/workflows/phase47-odds-retention.yml'
  push:
    paths:
      - 'supabase/migrations/20261018123000_phase47_odds_history_archive_first.sql'
      - 'supabase/functions/odds-cold-retire/index.ts'
      - 'scripts/check-phase47-odds-retention.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-phase47-odds-retention.mjs
      - run: npm run build
