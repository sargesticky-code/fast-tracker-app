name: Phase 19 Historic Football-Data Training
on:
  pull_request:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'supabase/functions/football-data-direct/index.ts'
      - 'scripts/check-phase19-football-data-history.mjs'
      - '.github/workflows/phase19-history-backfill.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/check-phase16-football-data-daily.mjs
      - run: node scripts/check-phase19-football-data-history.mjs
      - run: npm run check:native
      - run: npm run build
