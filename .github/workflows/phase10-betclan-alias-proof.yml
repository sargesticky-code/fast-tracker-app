name: Phase 10 BetClan Alias Proof
on:
  pull_request:
    branches: [release/ft-advisers-fotmob-20261011]
    paths:
      - 'supabase/migrations/20261017141700_phase10_audited_betclan_usl_obos_alias.sql'
      - 'scripts/check-phase10-betclan-competition-alias.mjs'
      - '.github/workflows/phase10-betclan-alias-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-phase10-betclan-competition-alias.mjs
