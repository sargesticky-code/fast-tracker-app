name: Forebet release public UI one-shot
on:
  push:
    branches: [probe/ft-forebet-render-20261010]
    paths:
      - '.github/workflows/ft-forebet-render-qa.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify real public dashboard Forebet figures on 3 viewports
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          for(const [size,w,h] of [['desktop',1440,900],['tablet',820,1180],['mobile',390,844]]) {
             const page=await browser.newPage({viewport:{width:w,height:h}});
             const errors=[];page.on('pageerror',e=>errors.push(e.message.slice(0,90)));
             const response=await page.goto('https://fast-tracker-public-production.up.railway.app',
               {waitUntil:'domcontentloaded',timeout:40000});
             if(!response||response.status()>=400)throw Error(size+' homepage HTTP '+response?.status());
             await page.locator('nav[aria-label="Primary match filters"]').getByRole('button',{name:'Tomorrow'}).click();
             await page.getByPlaceholder('Search team, league or match...').fill('Liverpool');
             const target=page.locator('a.ft-match-row').filter({hasText:'Liverpool'}).filter({hasText:'Manchester City'});
             try {await target.first().waitFor({state:'visible',timeout:38000});}
             catch(e){ console.log('FOREBET_RENDER_DIAG',size,JSON.stringify({
                count:await page.locator('a.ft-match-row').count(),
                matches:(await page.locator('a.ft-match-row').allTextContents()).slice(0,15),
                body:(await page.locator('body').innerText()).slice(0,1500),errors}));throw e; }
             const rowText=await target.first().innerText();
             if(!rowText.includes('1 - 2')||!rowText.includes('2.71'))throw Error(size+' predicted score/avg goals absent: '+rowText.slice(0,450));
             const prob=await target.first().locator('.ft-probs').innerText();
             if(!prob.includes('16')||!prob.includes('34')||!prob.includes('50'))
                 throw Error(size+' original Forebet HDA missing: '+prob);
             console.log('FOREBET_PUBLIC_UI_OK',JSON.stringify({size,score:'1 - 2',avgGoals:2.71,probability:prob.slice(0,130)}));
             await page.screenshot({path:'/tmp/forebet-'+size+'.png',fullPage:false});
             // Newly source-verified Greek league: same API feed, no new scraping.
             await page.getByPlaceholder('Search team, league or match...').fill('Kifisia');
             const greek=page.locator('a.ft-match-row').filter({hasText:'Kifisia'}).filter({hasText:'Panetolikos'});
             await greek.first().waitFor({state:'visible',timeout:20000});
             const greekRow=await greek.first().innerText();
             const greekP=await greek.first().locator('.ft-probs').innerText();
             if(!greekRow.includes('0 - 0')||!greekRow.includes('1.88')||
                 !['23','40','37'].every(p=>greekP.includes(p)))
                 throw Error(size+' newly added league models absent: '+JSON.stringify({greekRow,greekP}).slice(0,340));
             console.log('FOREBET_EXTRA_LEAGUE_UI_OK',JSON.stringify({size,match:'Kifisia-Panetolikos',score:'0 - 0',avg:1.88,probability:greekP.slice(0,110)}));

             await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forebet-3-responsive-evidence
          path: /tmp/forebet-*.png
          if-no-files-found: ignore
          retention-days: 3
